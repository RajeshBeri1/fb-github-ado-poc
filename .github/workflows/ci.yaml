name: Trigger Azure DevOps Pipeline

on:
  workflow_dispatch: # manual trigger
  push:
    branches:
      - develop-latest

jobs:
  run-ado-pipeline:
    runs-on: ubuntu-latest
    env:
      # Azure DevOps settings
      ADO_ORG: annalectus                  # your org
      ADO_PROJECT: flowchart-builder       # your project
      PIPELINE_ID: 31                      # Build Definition ID from _build?definitionId=31
      ADO_PAT: ${{ secrets.AZURE_DEVOPS_TOKEN }}   # store PAT in GitHub secrets

      # Variables to pass to ADO pipeline
      VAULT_KEY_NAME: kv-flowchart-dev-eus
      VAULT_KEY_SECRET: serveroverride-dev
      CONFIG_PATH: appsettings.override.json
      BACKEND_CAPP: backendapp-flowchart-dev-eus
      DESIGNER_CAPP: designerapp-flowchart-dev-eus
      PORTAL_CAPP: portalapp-flowchart-dev-eus
      SUBSCRIPTION: azure-omc-omg-ann20-shared-dev
      RESOURCE_GROUP: rg-ann20shareddev-flowchart-eus-app
      ACR: flowchart-dev-docker-service-connection
      KEY_VAULT: kv-flowchart-dev-eus
      SQL_DB: sqldb-flowchart-dev
      SQL_SERVER: sqlserver-flowchart-dev-eus.database.windows.net

    steps:
      - name: Trigger Azure DevOps Pipeline (Builds API)
        id: trigger
        run: |
          echo "🚀 Triggering Azure DevOps Build Pipeline $PIPELINE_ID ..."

          PARAMS=$(jq -n \
            --arg VAULT_KEY_NAME "$VAULT_KEY_NAME" \
            --arg VAULT_KEY_SECRET "$VAULT_KEY_SECRET" \
            --arg CONFIG_PATH "$CONFIG_PATH" \
            --arg BACKEND_CAPP "$BACKEND_CAPP" \
            --arg DESIGNER_CAPP "$DESIGNER_CAPP" \
            --arg PORTAL_CAPP "$PORTAL_CAPP" \
            --arg SUBSCRIPTION "$SUBSCRIPTION" \
            --arg RESOURCE_GROUP "$RESOURCE_GROUP" \
            --arg ACR "$ACR" \
            --arg KEY_VAULT "$KEY_VAULT" \
            --arg SQL_DB "$SQL_DB" \
            --arg SQL_SERVER "$SQL_SERVER" \
            '{
              VAULT_KEY_NAME: $VAULT_KEY_NAME,
              VAULT_KEY_SECRET: $VAULT_KEY_SECRET,
              CONFIG_PATH: $CONFIG_PATH,
              BACKEND_CAPP: $BACKEND_CAPP,
              DESIGNER_CAPP: $DESIGNER_CAPP,
              PORTAL_CAPP: $PORTAL_CAPP,
              SUBSCRIPTION: $SUBSCRIPTION,
              RESOURCE_GROUP: $RESOURCE_GROUP,
              ACR: $ACR,
              KEY_VAULT: $KEY_VAULT,
              SQL_DB: $SQL_DB,
              SQL_SERVER: $SQL_SERVER
            }' | jq -c)

          RESPONSE=$(curl -s -u ":$ADO_PAT" \
            -X POST "https://dev.azure.com/$ADO_ORG/$ADO_PROJECT/_apis/build/builds?api-version=7.0" \
            -H "Content-Type: application/json" \
            -d "{
              \"definition\": { \"id\": $PIPELINE_ID },
              \"parameters\": \"$PARAMS\"
            }")

          echo "Raw response: $RESPONSE"
          RUN_ID=$(echo $RESPONSE | jq -r '.id')
          echo "Triggered pipeline run ID: $RUN_ID"

          if [[ "$RUN_ID" == "null" || -z "$RUN_ID" ]]; then
            echo "❌ Could not extract Run ID. Check response above."
            exit 1
          fi

          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT

      - name: Stream Logs from Azure DevOps
        run: |
          RUN_ID=${{ steps.trigger.outputs.run_id }}
          echo "📡 Streaming logs for Run ID: $RUN_ID"

          while true; do
            STATUS=$(curl -s -u ":$ADO_PAT" \
              "https://dev.azure.com/$ADO_ORG/$ADO_PROJECT/_apis/build/builds/$RUN_ID?api-version=7.0" \
              | jq -r '.status')

            LOGS=$(curl -s -u ":$ADO_PAT" \
              "https://dev.azure.com/$ADO_ORG/$ADO_PROJECT/_apis/build/builds/$RUN_ID/logs?api-version=7.0")

            echo "$LOGS" | jq -r '.value[]?.url' | while read -r LOG_URL; do
              curl -s -u ":$ADO_PAT" "$LOG_URL" || true
            done

            if [[ "$STATUS" == "completed" ]]; then
              RESULT=$(curl -s -u ":$ADO_PAT" \
                "https://dev.azure.com/$ADO_ORG/$ADO_PROJECT/_apis/build/builds/$RUN_ID?api-version=7.0" \
                | jq -r '.result')

              echo "✅ Pipeline completed with result: $RESULT"

              if [[ "$RESULT" != "succeeded" ]]; then
                echo "❌ Azure DevOps pipeline failed with result: $RESULT"
                exit 1
              fi

              break
            fi

            echo "⏳ Pipeline still running... (status: $STATUS)"
            sleep 15
          done
