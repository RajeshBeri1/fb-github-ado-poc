name: Trigger Azure DevOps Pipeline

on:
  push:
    branches:
      - develop   # Trigger on develop branch

env:
  # Pipeline variables
  VAULT_KEY_NAME: kv-flowchart-dev-eus
  VAULT_KEY_SECRET: serveroverride-dev
  CONFIG_PATH: appsettings.override.json
  BACKEND_CAPP: backendapp-flowchart-dev-eus
  DESIGNER_CAPP: designerapp-flowchart-dev-eus
  PORTAL_CAPP: portalapp-flowchart-dev-eus
  SUBSCRIPTION: azure-omc-omg-ann20-shared-dev
  RESOURCE_GROUP: rg-ann20shareddev-flowchart-eus-app
  ACR: flowchart-dev-docker-service-connection
  KEY_VAULT: kv-flowchart-dev-eus
  SQL_DB: sqldb-flowchart-dev
  SQL_SERVER: sqlserver-flowchart-dev-eus.database.windows.net

jobs:
  trigger-pipeline:
    runs-on: ubuntu-latest
    outputs:
      buildId: ${{ steps.trigger.outputs.buildId }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Azure CLI & DevOps extension
        run: |
          az extension add -n azure-devops

      - name: Login to Azure DevOps
        run: |
          echo "${{ secrets.AZURE_DEVOPS_TOKEN }}" | az devops login --organization https://dev.azure.com/annalectus
        env:
          AZURE_DEVOPS_TOKEN: ${{ secrets.AZURE_DEVOPS_TOKEN }}

      - name: Trigger Azure DevOps pipeline
        id: trigger
        run: |
          ORG="https://dev.azure.com/annalectus"
          PROJECT="flowchart-builder"
          DEFINITION="flowchart-builder"
          BRANCH="develop"

          echo "Queuing build for branch $BRANCH..."
          buildId=$(az pipelines build queue \
            --branch "$BRANCH" \
            --org "$ORG" \
            --project "$PROJECT" \
            --definition-name "$DEFINITION" \
            --variables \
              VAULT_KEY_NAME=${{ env.VAULT_KEY_NAME }} \
              VAULT_KEY_SECRET=${{ env.VAULT_KEY_SECRET }} \
              CONFIG_PATH=${{ env.CONFIG_PATH }} \
              BACKEND_CAPP=${{ env.BACKEND_CAPP }} \
              DESIGNER_CAPP=${{ env.DESIGNER_CAPP }} \
              PORTAL_CAPP=${{ env.PORTAL_CAPP }} \
              SUBSCRIPTION=${{ env.SUBSCRIPTION }} \
              RESOURCE_GROUP=${{ env.RESOURCE_GROUP }} \
              ACR=${{ env.ACR }} \
              SQL_DB=${{ env.SQL_DB }} \
              SQL_SERVER=${{ env.SQL_SERVER }} \
              KEY_VAULT=${{ env.KEY_VAULT }} \
            --only-show-errors \
            --query id -o tsv)

          if [ -z "$buildId" ]; then
            echo "❌ Failed to trigger pipeline. Exiting."
            exit 1
          fi

          echo "BuildId=$buildId" >> $GITHUB_ENV
          echo "Triggered build ID: $buildId"
          echo "::set-output name=buildId::$buildId"

      - name: Stream Azure DevOps Logs Per Job
        run: |
          ORG="https://dev.azure.com/annalectus"
          PROJECT="flowchart-builder"
          TOKEN="${{ secrets.AZURE_DEVOPS_TOKEN }}"
          buildId=${{ env.BuildId }}

          declare -A NEXT_LINE
          declare -A HEADER_STATE_JOB
          declare -A HEADER_STATE_STEP

          # Function to stream step logs
          print_log_lines() {
            local logId="$1"
            local jobName="$2"
            local stepName="$3"
            local state="$4"

            # Open job header if not open
            if [[ "${HEADER_STATE_JOB[$jobName]:-}" != "open" ]]; then
              echo "::group::JOB: $jobName"
              HEADER_STATE_JOB[$jobName]="open"
            fi

            # Open step header if not open
            if [[ "${HEADER_STATE_STEP[$logId]:-}" != "open" && "${HEADER_STATE_STEP[$logId]:-}" != "closed" ]]; then
              echo "::group::STEP: $stepName"
              HEADER_STATE_STEP[$logId]="open"
            fi

            local start="${NEXT_LINE[$logId]:-1}"
            local url="$ORG/$PROJECT/_apis/build/builds/$buildId/logs/$logId?startLine=$start&api-version=7.1"

            local content
            content=$(curl -sS -u ":$TOKEN" "$url") || return

            if [[ -n "$content" ]]; then
              while IFS= read -r line; do
                printf "[%s] [%s | %s] %s\n" "$(date +'%H:%M:%S')" "$jobName" "$stepName" "$line"
              done <<< "$content"

              local lines
              lines=$(printf "%s" "$content" | wc -l | awk '{print $1}')
              NEXT_LINE[$logId]=$((start + lines))
            fi

            # Close step if completed
            if [[ "$state" == "completed" && "${HEADER_STATE_STEP[$logId]}" == "open" ]]; then
              echo "::endgroup::"  # close step
              HEADER_STATE_STEP[$logId]="closed"
              echo ""
            fi
          }

          echo "Fetching timeline for build $buildId..."
          while true; do
            timeline=$(curl -s -u ":$TOKEN" "$ORG/$PROJECT/_apis/build/builds/$buildId/timeline?api-version=7.1")

            # Extract jobs and steps
            echo "$timeline" | jq -r '.records[] | select(.log.id != null) | "\(.log.id)|\(.parentId)|\(.name)|\(.state)"' |
            while IFS="|" read -r logId parentId stepName state; do
              jobName=$(echo "$timeline" | jq -r ".records[] | select(.id==\"$parentId\") | .name")
              [ "$jobName" = "null" ] && jobName="Main"

              # Stream logs for this step
              print_log_lines "$logId" "$jobName" "$stepName" "$state"

              # Save logs to file per job
              mkdir -p logs
              curl -sS -u ":$TOKEN" "$ORG/$PROJECT/_apis/build/builds/$buildId/logs/$logId" >> "logs/${jobName}.log"
            done

            # Check build status
            status=$(az pipelines build show --id $buildId --org $ORG --project $PROJECT --query status -o tsv)
            if [ "$status" == "completed" ]; then
              break
            fi
            sleep 5
          done

          # Close all open job groups
          for j in "${!HEADER_STATE_JOB[@]}"; do
            if [[ "${HEADER_STATE_JOB[$j]}" == "open" ]]; then
              echo "::endgroup::"
              HEADER_STATE_JOB[$j]="closed"
            fi
          done

          # Upload logs as artifact
          echo "Uploading logs as artifacts..."
          echo "logs" >> $GITHUB_ENV

          result=$(az pipelines build show --id $buildId --org $ORG --project $PROJECT --query result -o tsv)
          echo "FINAL RESULT: $result"
          if [ "$result" != "succeeded" ]; then exit 1; fi

      - name: Upload logs as artifact
        uses: actions/upload-artifact@v3
        with:
          name: ado-logs
          path: logs/