name: Azure DevOps Pipeline Proxy

on:
  workflow_dispatch:   # manual trigger from GitHub
  push:
    branches:
      - develop        # run automatically on develop branch

env:
  ORGANISATION: "https://dev.azure.com/<your-org>"   # 👈 replace
  PROJECT: "flowchart-builder"                          # 👈 replace
  PIPELINE_NAME: "flowchart-builder"                 # 👈 replace

jobs:
  run-ado-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install Azure CLI + DevOps extension
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
          az extension add --name azure-devops

      - name: Authenticate Azure DevOps CLI
        env:
          AZURE_DEVOPS_EXT_PAT: ${{ secrets.AZURE_DEVOPS_TOKEN }}
        run: |
          echo "${AZURE_DEVOPS_EXT_PAT}" | az devops login --organization ${{ env.ORGANISATION }}

      - name: Get Pipeline ID dynamically
        id: get-pipeline
        run: |
          PIPELINE_ID=$(az pipelines show \
            --name "${{ env.PIPELINE_NAME }}" \
            --org "${{ env.ORGANISATION }}" \
            --project "${{ env.PROJECT }}" \
            --query "id" -o tsv)

          if [ -z "$PIPELINE_ID" ]; then
            echo "❌ Failed to fetch pipeline ID"
            exit 1
          fi

          echo "PIPELINE_ID=$PIPELINE_ID" >> $GITHUB_ENV
          echo "✅ Pipeline ID is: $PIPELINE_ID"

      - name: Trigger Azure Pipeline (develop branch)
        id: run-pipeline
        run: |
          RUN_ID=$(az pipelines run \
            --id $PIPELINE_ID \
            --branch develop \
            --org "${{ env.ORGANISATION }}" \
            --project "${{ env.PROJECT }}" \
            --query "id" -o tsv)

          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
          echo "✅ Triggered pipeline run: $RUN_ID"

      - name: Stream ADO logs into GitHub
        run: |
          set -e
          RUN_ID=${{ env.RUN_ID }}
          echo "📡 Streaming logs for Run ID: $RUN_ID"

          while true; do
            RUN_DETAILS=$(curl -s -u ":${{ secrets.AZURE_DEVOPS_TOKEN }}" \
              "${{ env.ORGANISATION }}/${{ env.PROJECT }}/_apis/pipelines/runs/$RUN_ID?api-version=7.1-preview.1")

            STATE=$(echo "$RUN_DETAILS" | jq -r '.state')
            RESULT=$(echo "$RUN_DETAILS" | jq -r '.result // empty')

            echo "🔄 Current pipeline status: $STATE"

            # Dump job logs
            TIMELINE=$(curl -s -u ":${{ secrets.AZURE_DEVOPS_TOKEN }}" \
              "${{ env.ORGANISATION }}/${{ env.PROJECT }}/_apis/build/builds/$RUN_ID/timeline?api-version=7.1-preview.1")

            if echo "$TIMELINE" | jq -e '.records' > /dev/null; then
              for url in $(echo "$TIMELINE" | jq -r '.records[] | select(.log != null) | .log.url'); do
                echo "⬇️ Fetching logs from $url"
                curl -s -u ":${{ secrets.AZURE_DEVOPS_TOKEN }}" "$url"
              done
            fi

            if [ "$STATE" = "completed" ]; then
              echo "🏁 Pipeline completed with result: $RESULT"
              [ "$RESULT" = "succeeded" ] && exit 0 || exit 1
            fi

            sleep 10
          done
