name: Trigger Azure DevOps Pipeline

on:
  push:
    branches:
      - develop   # Run only when pushing to develop branch
    
env:
  # Pipeline variables
  VAULT_KEY_NAME: kv-flowchart-dev-eus
  VAULT_KEY_SECRET: serveroverride-dev
  CONFIG_PATH: appsettings.override.json
  BACKEND_CAPP: backendapp-flowchart-dev-eus
  DESIGNER_CAPP: designerapp-flowchart-dev-eus
  PORTAL_CAPP: portalapp-flowchart-dev-eus
  SUBSCRIPTION: azure-omc-omg-ann20-shared-dev
  RESOURCE_GROUP: rg-ann20shareddev-flowchart-eus-app
  ACR: flowchart-dev-docker-service-connection
  KEY_VAULT: kv-flowchart-dev-eus
  SQL_DB: sqldb-flowchart-dev
  SQL_SERVER: sqlserver-flowchart-dev-eus.database.windows.net

jobs:
  trigger-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Azure CLI & DevOps extension
        run: |
          az extension add -n azure-devops

      - name: Login to Azure DevOps
        run: |
          echo "${{ secrets.AZURE_DEVOPS_TOKEN }}" | az devops login --organization https://dev.azure.com/annalectus
        env:
          AZURE_DEVOPS_TOKEN: ${{ secrets.AZURE_DEVOPS_TOKEN }}

      - name: Trigger Azure DevOps pipeline
        id: trigger
        run: |
          ORG="https://dev.azure.com/annalectus"
          PROJECT="flowchart-builder"
          DEFINITION="flowchart-builder"
          BRANCH="develop"

          echo "Queuing build for branch $BRANCH"

          buildId=$(az pipelines build queue \
            --branch "$BRANCH" \
            --org $ORG \
            --project $PROJECT \
            --definition-name $DEFINITION \
            --variables \
              VAULT_KEY_NAME=${{ env.VAULT_KEY_NAME }} \
              VAULT_KEY_SECRET=${{ env.VAULT_KEY_SECRET }} \
              CONFIG_PATH=${{ env.CONFIG_PATH }} \
              BACKEND_CAPP=${{ env.BACKEND_CAPP }} \
              DESIGNER_CAPP=${{ env.DESIGNER_CAPP }} \
              PORTAL_CAPP=${{ env.PORTAL_CAPP }} \
              SUBSCRIPTION=${{ env.SUBSCRIPTION }} \
              RESOURCE_GROUP=${{ env.RESOURCE_GROUP }} \
              ACR=${{ env.ACR }} \
              SQL_DB=${{ env.SQL_DB }} \
              SQL_SERVER=${{ env.SQL_SERVER }} \
              KEY_VAULT=${{ env.KEY_VAULT }} \
            --only-show-errors \
            --query id -o tsv)

          echo "BuildId=$buildId" >> $GITHUB_ENV
          echo "Triggered build ID: $buildId"

      - name: Stream logs from Azure DevOps
        run: |
          ORG="https://dev.azure.com/annalectus"
          PROJECT="flowchart-builder"
          buildId=${{ env.BuildId }}

          echo "Fetching logs for build $buildId"

          status=$(az pipelines build show --id $buildId --org $ORG --project $PROJECT --query status -o tsv)

          while [ "$status" != "completed" ]; do
            echo "Build status: $status"

            # Fetch log list
            logs=$(curl -s -u ":${{ secrets.AZURE_DEVOPS_TOKEN }}" \
              "$ORG/$PROJECT/_apis/build/builds/$buildId/logs?api-version=7.1")

            log_count=$(echo $logs | jq '.count')
            for i in $(seq 1 $log_count); do
              curl -s -u ":${{ secrets.AZURE_DEVOPS_TOKEN }}" \
                "$ORG/$PROJECT/_apis/build/builds/$buildId/logs/$i?api-version=7.1"
            done

            sleep 30
            status=$(az pipelines build show --id $buildId --org $ORG --project $PROJECT --query status -o tsv)
          done

          # Final result
          result=$(az pipelines build show --id $buildId --org $ORG --project $PROJECT --query result -o tsv)
          echo "Final result: $result"

          if [ "$result" = "failed" ]; then
            exit 1
          elif [ "$result" = "succeeded" ]; then
            exit 0
          else
            echo "Unknown build status"
            exit 1
          fi


