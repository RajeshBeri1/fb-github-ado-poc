name: Trigger Azure DevOps Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - develop-latest

jobs:
  run-ado-pipeline:
    runs-on: ubuntu-latest
    env:
      # Azure DevOps settings
      ADO_ORG: annalectus
      ADO_PROJECT: flowchart-builder
      PIPELINE_ID: 31
      ADO_PAT: ${{ secrets.AZURE_DEVOPS_TOKEN }}

      # Variables to pass to ADO pipeline
      VAULT_KEY_NAME: kv-flowchart-dev-eus
      VAULT_KEY_SECRET: serveroverride-dev
      CONFIG_PATH: appsettings.override.json
      BACKEND_CAPP: backendapp-flowchart-dev-eus
      DESIGNER_CAPP: designerapp-flowchart-dev-eus
      PORTAL_CAPP: portalapp-flowchart-dev-eus
      SUBSCRIPTION: azure-omc-omg-ann20-shared-dev
      RESOURCE_GROUP: rg-ann20shareddev-flowchart-eus-app
      ACR: flowchart-dev-docker-service-connection
      KEY_VAULT: kv-flowchart-dev-eus
      SQL_DB: sqldb-flowchart-dev
      SQL_SERVER: sqlserver-flowchart-dev-eus.database.windows.net

    steps:
      - name: Trigger Azure DevOps Pipeline
        id: trigger
        run: |
          echo "🚀 Triggering Azure DevOps Pipeline $PIPELINE_ID ..."

          RESPONSE=$(curl -s -u ":$ADO_PAT" \
            -X POST "https://dev.azure.com/$ADO_ORG/$ADO_PROJECT/_apis/pipelines/$PIPELINE_ID/runs?api-version=7.0" \
            -H "Content-Type: application/json" \
            -d "{
              \"resources\": {
                \"repositories\": {
                  \"self\": { \"refName\": \"refs/heads/main\" }
                }
              },
              \"variables\": {
                \"VAULT_KEY_NAME\": {\"value\": \"$VAULT_KEY_NAME\"},
                \"VAULT_KEY_SECRET\": {\"value\": \"$VAULT_KEY_SECRET\"},
                \"CONFIG_PATH\": {\"value\": \"$CONFIG_PATH\"},
                \"BACKEND_CAPP\": {\"value\": \"$BACKEND_CAPP\"},
                \"DESIGNER_CAPP\": {\"value\": \"$DESIGNER_CAPP\"},
                \"PORTAL_CAPP\": {\"value\": \"$PORTAL_CAPP\"},
                \"SUBSCRIPTION\": {\"value\": \"$SUBSCRIPTION\"},
                \"RESOURCE_GROUP\": {\"value\": \"$RESOURCE_GROUP\"},
                \"ACR\": {\"value\": \"$ACR\"},
                \"KEY_VAULT\": {\"value\": \"$KEY_VAULT\"},
                \"SQL_DB\": {\"value\": \"$SQL_DB\"},
                \"SQL_SERVER\": {\"value\": \"$SQL_SERVER\"}
              }
            }")

          echo "Raw response from ADO:"
          echo "$RESPONSE"

          RUN_ID=$(echo "$RESPONSE" | jq -r '.id // empty')

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" == "null" ]; then
            echo "❌ Could not extract Run ID. Check raw response above."
            exit 1
          fi

          echo "✅ Triggered pipeline run ID: $RUN_ID"
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT

      - name: Stream Logs from Azure DevOps
        run: |
          RUN_ID=${{ steps.trigger.outputs.run_id }}
          echo "📡 Streaming logs for Run ID: $RUN_ID"

          while true; do
            STATUS=$(curl -s -u ":$ADO_PAT" \
              "https://dev.azure.com/$ADO_ORG/$ADO_PROJECT/_apis/pipelines/$PIPELINE_ID/runs/$RUN_ID?api-version=7.0" \
              | jq -r '.state')

            echo "⏳ Current pipeline state: $STATUS"

            # Fetch logs (these are jobs/stages, not the old build logs)
            LOGS=$(curl -s -u ":$ADO_PAT" \
              "https://dev.azure.com/$ADO_ORG/$ADO_PROJECT/_apis/pipelines/$PIPELINE_ID/runs/$RUN_ID/logs?api-version=7.0")

            echo "$LOGS" | jq -r '.value[]?.url' | while read -r LOG_URL; do
              curl -s -u ":$ADO_PAT" "$LOG_URL" || true
            done

            if [[ "$STATUS" == "completed" ]]; then
              RESULT=$(curl -s -u ":$ADO_PAT" \
                "https://dev.azure.com/$ADO_ORG/$ADO_PROJECT/_apis/pipelines/$PIPELINE_ID/runs/$RUN_ID?api-version=7.0" \
                | jq -r '.result')

              echo "✅ Pipeline completed with result: $RESULT"

              if [[ "$RESULT" != "succeeded" ]]; then
                echo "❌ Azure DevOps pipeline failed with result: $RESULT"
                exit 1
              fi
              break
            fi

            sleep 15
          done
